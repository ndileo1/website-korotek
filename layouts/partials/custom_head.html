<!-- Custom CSS via inline styles -->
<style>
:root {
    --cover-text-color: black !important;
}

/* Global Inox Background */
html, body {
    background-color: #1a1a1a !important;
    background-image: url('/images/inox.jpeg') !important;
    background-size: cover !important;
    background-attachment: fixed !important;
    background-position: center center !important;
    color: #ffffff;
}

/* Homepage Wireframe Layout (PC & Mobile) */
.homepage-hero {
    position: relative;
    min-height: calc(100vh - 75px);
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 2.5rem 2rem 5.5rem 2rem;
    box-sizing: border-box;
    background: transparent !important;
}

.main-layout-container {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 60px;
    align-items: center;
}

/* Section Haut : 3 éléments */
.top-gallery {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    gap: 30px;
}

.gallery-item {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gallery-img {
    max-width: 100%;
    height: auto;
    max-height: 550px;
    object-fit: contain;
    border-radius: 8px;
    filter: drop-shadow(0 6px 20px rgba(0, 0, 0, 0.5));
}

.center-logo-block {
    flex-direction: column;
    gap: 15px;
    text-align: center;
}

.brand-logo {
    max-width: 420px;
    width: 100%;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 6px 20px rgba(255, 255, 255, 0.08));
}

.headline-box {
    display: flex;
    flex-direction: column;
    gap: 5px;
}

.hero-title {
    font-size: 4rem;
    font-weight: 800;
    color: #ffffff !important;
    margin: 0;
    line-height: 1.1;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9), 0 1px 3px rgba(0,0,0,0.8);
}

.hero-subtitle {
    font-size: 2.2rem;
    font-weight: 400;
    color: #f1f5f9 !important;
    margin: 0;
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.85);
}

.hero-subtitle b {
    color: #38bdf8 !important;
    font-weight: 700;
}

/* Section Bas : Bio */
.bottom-bio {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 30px;
    width: 100%;
    max-width: 1100px;
}

.bio-photo {
    width: 180px;
    height: auto;
    object-fit: cover;
    border-radius: 8px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.6);
}

.bio-text-content {
    flex: 1;
    border: 1px solid rgba(255,255,255,0.4);
    padding: 25px 35px;
    background: rgba(0, 0, 0, 0.4);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 15px;
}

.bio-text-content p {
    margin: 0;
    color: #f8fafc;
    font-size: 1.35rem;
    line-height: 1.6;
    text-align: left;
    font-weight: 400;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
}

.bio-separator {
    border: 0;
    border-top: 1px dashed rgba(255,255,255,0.4);
    margin: 0;
    width: 100%;
}

/* Mode Téléphone (Mobile Layout) */
@media (max-width: 900px) {
    .homepage-hero {
        padding: 2rem 1.2rem 4rem 1.2rem;
        min-height: auto;
    }

    .main-layout-container {
        gap: 40px;
    }

    .top-gallery {
        flex-direction: column;
        gap: 40px;
    }
    
    .center-logo-block {
        order: -1;
    }
    
    .bottom-bio {
        flex-direction: column;
        align-items: center;
        text-align: center;
    }
    
    .bio-text-content p {
        text-align: center;
        font-size: 1.25rem;
    }

    .hero-title {
        font-size: 2.4rem;
    }

    .hero-subtitle {
        font-size: 1.6rem;
    }

    .site-footer.custom-footer {
        position: relative !important;
        box-shadow: none;
    }
}

/* Footer toujours visible en bas de page */
.site-footer.custom-footer {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    z-index: 9999;
    background: rgba(15, 15, 18, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid rgba(200, 200, 200, 0.2);
    box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
    padding: 0.6rem 1.5rem;
    color: #f1f5f9;
}

.footer-container {
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
}

.footer-branding {
    display: flex;
    align-items: center;
    gap: 12px;
}

.footer-logo {
    height: 65px;
    width: auto;
    object-fit: contain;
    transition: transform 0.2s ease;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
}

.footer-logo:hover {
    transform: scale(1.04);
}

.footer-profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.footer-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #38bdf8;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

.footer-profile-info {
    display: flex;
    flex-direction: column;
    text-align: left;
}

.footer-name {
    font-weight: 600;
    font-size: 0.9rem;
    color: #ffffff;
    line-height: 1.2;
}

.footer-subtitle {
    font-size: 0.75rem;
    color: #94a3b8;
}

.footer-contacts {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
}

.footer-contact-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 25px;
    color: #ffffff !important;
    text-decoration: none !important;
    font-size: 1.1rem;
    font-weight: 500;
    transition: all 0.25s ease;
}

.footer-contact-item:hover {
    background: #38bdf8;
    color: #0f172a !important;
    border-color: #38bdf8;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
}

.footer-contact-item i {
    font-size: 1.2rem;
}

/* Colorisation des icônes de contact */
.footer-contact-item:nth-child(1) i {
    color: #10b981; /* Vert pour le téléphone */
}
.footer-contact-item:nth-child(2) i {
    color: #38bdf8; /* Bleu pour l'email */
}
.footer-contact-item:nth-child(3) i {
    color: #f59e0b; /* Orange pour l'adresse */
}

/* Espace en bas pour ne pas masquer le contenu */
body {
    padding-bottom: 75px;
}

@media (max-width: 768px) {
    .footer-container {
        justify-content: center;
        gap: 10px;
    }
    .footer-subtitle {
        display: none;
    }
    body {
        padding-bottom: 0;
    }
}
</style>
